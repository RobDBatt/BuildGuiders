# Runs the article generator and opens a PR with whatever it produced.
#
# Ported from .claude/retired/auto-generate.yml.retired on the orphan `main`
# branch, with two substantive changes:
#
#   1. It opens a pull request instead of pushing straight to the default branch.
#      The old one committed and pushed, which put up to twenty AI-written
#      articles on production with nobody reading them.
#   2. Five of its quality gates called npm scripts that do not exist here, and
#      two of those validated television specs (power-cycle times, viewing
#      distance) — leftovers from the GadgetGuiders clone. They are replaced by
#      scripts/check-generated-articles.mjs, which checks the AGENTS.md rules a
#      generator can actually break.
#
# Manual trigger only. The weekly schedule stays commented out until a run has
# been reviewed and the output is trusted. The "count" input defaults to 3 rather
# than the script's own 20: the point of the first runs is that somebody reads
# every article, and twenty is more than anyone reads carefully.
#
# Requires GEMINI_API_KEY in repository secrets:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#
# Optionally set a GEMINI_MODEL repository variable to override the default.
# `npm run models` lists what a key can actually reach.

name: Generate Articles

on:
  # schedule:
  #   - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      count:
        description: 'Articles to generate (1-50). Keep it small — every one has to be read.'
        required: false
        default: '3'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-articles
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Fail early if the API key is missing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY is not set in repository secrets."
            echo "Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "API key present."

      - run: npm ci

      - name: Generate articles
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MAX_NEW_ARTICLES: ${{ inputs.count }}
        run: |
          echo "Generating up to ${MAX_NEW_ARTICLES:-20} article(s)."
          npm run generate

      - name: Collect newly added articles
        id: collect
        run: |
          NEW_FILES=$(git ls-files --others --exclude-standard -- 'content/articles/*.mdx')
          COUNT=$(printf '%s\n' "$NEW_FILES" | grep -c '\.mdx$' || true)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          {
            echo "files<<EOF"
            printf '%s\n' "$NEW_FILES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ "$COUNT" -eq 0 ]; then
            echo "No new articles. Every candidate topic already exists as an article."
          else
            echo "$COUNT new article(s):"
            printf '%s\n' "$NEW_FILES"
          fi

      - name: Gate — article quality
        if: steps.collect.outputs.count != '0'
        run: |
          printf '%s\n' "${{ steps.collect.outputs.files }}" \
            | grep '\.mdx$' \
            | xargs node scripts/check-generated-articles.mjs

      # Also runs check-redirects and check-calculator-links, so a generated
      # article in a category with no calculator fails here rather than shipping
      # without its cross-link.
      - name: Gate — build
        if: steps.collect.outputs.count != '0'
        run: npm run build

      - name: Open a pull request
        if: steps.collect.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE=$(date +'%Y-%m-%d')
          BRANCH="content/generated-${DATE}-${GITHUB_RUN_ID}"
          COUNT="${{ steps.collect.outputs.count }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add content/articles/*.mdx
          git commit -m "Add ${COUNT} generated article(s), ${DATE}"
          git push -u origin "$BRANCH"

          {
            echo "Generated by the \`Generate Articles\` workflow, run \`${GITHUB_RUN_ID}\`."
            echo
            echo "**${COUNT} new article(s):**"
            echo
            printf '%s\n' "${{ steps.collect.outputs.files }}" | grep '\.mdx$' | sed 's|^|- |'
            echo
            echo "Passed \`check-generated-articles\` (title and description length,"
            echo "one H1, affiliate tag, word count, no fabricated first-hand experience)"
            echo "and a full \`npm run build\`."
            echo
            echo "**These have not been read by a person.** The gates catch rule breaches,"
            echo "not whether an article is any good or its facts are right. Read them"
            echo "before merging."
          } > /tmp/pr-body.md

          gh pr create \
            --base "${GITHUB_REF_NAME}" \
            --head "$BRANCH" \
            --title "Add ${COUNT} generated article(s), ${DATE}" \
            --body-file /tmp/pr-body.md

      - name: Nothing to do
        if: steps.collect.outputs.count == '0'
        run: echo "No new articles generated, so no pull request was opened."
