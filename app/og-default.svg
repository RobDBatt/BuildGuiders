<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <!-- Background gradient -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle glow blob -->
  <circle cx="980" cy="140" r="160" fill="#38bdf8" opacity="0.25" filter="url(#soft)"/>
  <circle cx="250" cy="500" r="180" fill="#22d3ee" opacity="0.18" filter="url(#soft)"/>

  <!-- Title -->
  <g fill="#ffffff">
    <text x="80" y="300" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="88" font-weight="800">
      BuildGuiders
    </text>

    <!-- Tagline -->
    <text x="80" y="360" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="36" opacity="0.9">
      Smart fixes for HDMI, TV &amp; audio
    </text>

    <!-- URL -->
    <text x="80" y="560" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="28" opacity="0.8">
      buildguiders.com
    </text>
  </g>

  <!-- Simple mark -->
  <g transform="translate(1000, 480)">
    <rect x="-40" y="-40" width="80" height="80" rx="18" fill="#0b1220" stroke="#e2e8f0" stroke-opacity="0.25"/>
    <path d="M -14 -10 L 14 -10 L 14 10 L -14 10 Z" fill="#0ea5e9" opacity="0.9"/>
    <circle cx="0" cy="-18" r="6" fill="#e2e8f0" opacity="0.88"/>
  </g>
</svg>
